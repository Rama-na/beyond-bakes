name: Deploy to GitHub Pages

# The repo root holds the Vite *source* index.html, which points at
# /src/main.tsx — a browser cannot run that. Pages must serve the built output,
# so this builds the site and publishes dist/ as the Pages artifact.
#
# One-time setup: repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `base` comes from vite.config.ts (/beyond-bakes/). Override here if the
      # site ever moves to a custom domain: env: { VITE_BASE: / }
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
