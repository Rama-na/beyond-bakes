<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFDF9" />

    <title>BeyondBakes — Where Every Bite Is a Work of Art</title>
    <meta
      name="description"
      content="BeyondBakes is a Chennai-based pastry brand by Girvani and Swapna. Celebration cakes made to order in Anna Nagar."
    />

    <!-- Absolute URLs: social scrapers do not resolve relative ones. Update
         these together with vite.config.ts `base` if the domain changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BeyondBakes" />
    <meta property="og:title" content="BeyondBakes — Where Every Bite Is a Work of Art" />
    <meta
      property="og:description"
      content="A Chennai-based pastry brand by Girvani and Swapna. Celebration cakes made to order in Anna Nagar."
    />
    <meta property="og:image" content="https://rama-na.github.io/beyond-bakes/brand/logo-mark.png" />
    <meta property="og:url" content="https://rama-na.github.io/beyond-bakes/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BeyondBakes — Where Every Bite Is a Work of Art" />
    <meta
      name="twitter:description"
      content="A Chennai-based pastry brand by Girvani and Swapna. Celebration cakes made to order in Anna Nagar."
    />
    <meta name="twitter:image" content="https://rama-na.github.io/beyond-bakes/brand/logo-mark.png" />

    <link rel="icon" type="image/png" href="%BASE_URL%brand/logo-mark-small.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/logo-mark.png" />
    <link rel="canonical" href="https://rama-na.github.io/beyond-bakes/" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
